<body>
<div class="app">
  <header class="toolbar">
    <div class="brand"><span class="chest-mark" aria-hidden="true"></span><strong>Storage</strong></div>
    <div class="search-wrap">
      <label class="sr-only" for="search">Search items or chest positions on all floors</label>
      <input id="search" type="search" placeholder="Search items or positions…" autocomplete="off" aria-controls="results" aria-expanded="false">
      <div id="results" class="results" role="region" aria-label="Search results" hidden></div>
    </div>
    <div class="actions">
      <button id="newChest" type="button">+ Chest</button>
      <button id="undo" class="quiet" type="button" title="Undo (Ctrl/Cmd+Z)" disabled>↶ <span>Undo</span></button>
      <button id="redo" class="quiet" type="button" title="Redo (Ctrl/Cmd+Shift+Z)" disabled>↷ <span>Redo</span></button>
      <span class="divider" aria-hidden="true"></span>
      <button id="import" type="button" title="Open a complete layout JSON file">Import</button>
      <button id="export" class="primary" type="button" title="Download every floor, chest and staging assignment">Export</button>
      <input id="importFile" type="file" accept=".json,application/json" hidden>
    </div>
  </header>
  <div class="floor-navigation"><nav id="floors" class="floors" aria-label="Floors"></nav><button id="newFloor" class="quiet" type="button">+ Floor</button></div>
  <div class="floor-heading"><h1 id="floorName"></h1><button id="editFloor" class="quiet" type="button">Edit floor</button><span id="saveStatus" class="save-status" title="Changes save automatically in this browser">Saved</span></div>
  <div id="error" class="error" role="alert" hidden></div>
  <main id="mapScroll" class="map-scroll"><div id="map" class="map" aria-label="Floor chest layout"></div></main>
</div>
<dialog id="chestEditor" class="editor-dialog" aria-labelledby="chestEditorHeading">
  <form id="chestForm">
    <div class="dialog-heading"><h2 id="chestEditorHeading">Edit chest</h2><button type="button" data-close="chestEditor" class="quiet" aria-label="Close chest editor">✕</button></div>
    <label class="field">Chest name<input id="chestName" required maxlength="300" autocomplete="off"></label>
    <div class="catalog-label"><label for="catalogSearch">Add items</label><small>Java 26.1</small></div>
    <input id="catalogSearch" type="search" placeholder="Search items or type a custom name…" autocomplete="off" aria-controls="catalogResults">
    <div id="catalogResults" class="catalog-results"></div>
    <div class="contents-heading"><h3>Contents</h3><span id="draftItemCount"></span></div>
    <div id="draftItems" class="draft-items"></div>
    <p id="chestEditError" class="form-error" role="alert" hidden></p>
    <div class="dialog-actions"><button type="button" data-close="chestEditor">Cancel</button><button id="saveChest" type="submit" class="primary">Save chest</button></div>
  </form>
</dialog>
<dialog id="floorEditor" class="editor-dialog floor-dialog" aria-labelledby="floorEditorHeading">
  <form id="floorForm">
    <div class="dialog-heading"><h2 id="floorEditorHeading">Edit floor</h2><button type="button" data-close="floorEditor" class="quiet" aria-label="Close floor editor">✕</button></div>
    <label class="field">Floor name<input id="floorTitle" required maxlength="300" autocomplete="off"></label>
    <fieldset class="wall-options"><legend>Walls</legend><label><input type="checkbox" name="wall" value="T">Top</label><label><input type="checkbox" name="wall" value="R">Right</label><label><input type="checkbox" name="wall" value="B">Bottom</label><label><input type="checkbox" name="wall" value="L">Left</label></fieldset>
    <p class="form-hint">Chests from removed walls or floors move to staging.</p>
    <p id="floorEditError" class="form-error" role="alert" hidden></p>
    <div class="dialog-actions"><button id="deleteFloor" type="button" class="danger">Delete floor</button><span class="action-spacer"></span><button type="button" data-close="floorEditor">Cancel</button><button type="submit" class="primary">Save floor</button></div>
  </form>
</dialog>
<div id="notice" class="notice" role="status" aria-live="polite"></div>

/* Pure layout operations. A chest identity never depends on its current slot. */
const Layout = (() => {
  const FORMAT = 'minecraft-storage-layout';
  const ROWS = 'TMB';
  const REVISION = 'v15-configurable-planner';
  const COORDINATE_SYSTEM = 'wall-facing-tmb';
  const coordinates = {T1:[1,2],T2:[1,3],T3:[1,4],R1:[2,5],R2:[3,5],R3:[4,5],B1:[5,2],B2:[5,3],B3:[5,4],L1:[2,1],L2:[3,1],L3:[4,1]};
  const slotsOf = square => Array.from({length:9}, (_,i) => `${square.id}-${ROWS[Math.floor(i/3)]}${i%3+1}`);
  // Readable text remains upright; only the positions of the nine tiles rotate.
  // Column 1 is the leftmost column when standing inside and facing that wall.
  const wallOrder = {
    T:['T1','T2','T3','M1','M2','M3','B1','B2','B3'],
    R:['B1','M1','T1','B2','M2','T2','B3','M3','T3'],
    B:['B3','B2','B1','M3','M2','M1','T3','T2','T1'],
    L:['T3','M3','B3','T2','M2','B2','T1','M1','B1']
  };
  const displaySlotsOf = square => wallOrder[square.wall].map(position=>`${square.id}-${position}`);
  const canonicalSlot = id => typeof id === 'string' ? id.replace(/^(F\d+[TRBL][1-3]-)([UD])([1-3])$/,(all,base,row,col)=>base+(row==='U'?'T':'B')+col) : id;
  const fail = message => { throw new Error(message); };
  const isObject = value => value && typeof value === 'object' && !Array.isArray(value);
  const string = (value, name, max=300, optional=false) => {
    if (optional && (value === undefined || value === null)) return '';
    if (typeof value !== 'string' || (!optional && !value.trim()) || value.length > max) fail(`Invalid ${name}.`);
    return value;
  };
  const unique = (list, name) => { if(new Set(list).size !== list.length) fail(`Duplicate ${name}.`); };

  function migrateLegacy(raw) {
    if (!isObject(raw.placements) || !Array.isArray(raw.chests)) fail('Placements or prepared chests are missing.');
    const placements = {};
    for (const [oldSlot,chestId] of Object.entries(raw.placements)) {
      if (!/^F\d+[TRBL][1-3]-[UMD][1-3]$/.test(oldSlot)) fail('Invalid legacy chest position.');
      placements[canonicalSlot(oldSlot)] = chestId;
    }
    // Opaque chest identities and staged chests stay intact across coordinate changes.
    return {...raw,schemaVersion:2,coordinateSystem:COORDINATE_SYSTEM,revision:REVISION,placements,
      chests:raw.chests.map(c=>isObject(c)?{...c,sourceSlot:canonicalSlot(c.sourceSlot)}:c)};
  }

  function validate(raw) {
    if (!isObject(raw) || raw.format !== FORMAT || ![1,2,3].includes(raw.schemaVersion)) fail('This is not a supported storage layout export.');
    if (raw.schemaVersion === 1) raw = migrateLegacy(raw);
    if (raw.coordinateSystem !== COORDINATE_SYSTEM) fail('Unsupported chest coordinate system.');
    if (!Array.isArray(raw.floors) || raw.floors.length > 100) fail('Invalid floor list.');
    if (!Array.isArray(raw.squares) || raw.squares.length > 1200) fail('Invalid square list.');
    if (!Array.isArray(raw.chests) || raw.chests.length > 20000) fail('Invalid chest list.');
    if (!isObject(raw.placements) || !Array.isArray(raw.staging)) fail('Placements or staging are missing.');
    const floors = raw.floors.map(f => {
      if (!isObject(f) || !Number.isInteger(f.id) || f.id < 0 || f.id > 9999) fail('Invalid floor.');
      const walls=raw.schemaVersion<3 ? ['T','R','B','L'].filter(w=>raw.squares.some(s=>s.floor===f.id&&s.wall===w)) : f.walls;
      if(!Array.isArray(walls)||walls.length<1||walls.length>4||walls.some(w=>!['T','R','B','L'].includes(w))) fail('Choose at least one wall.');
      unique(walls,'wall');
      return {id:f.id,name:string(f.name,'floor name'),shortName:string(f.shortName||f.name,'floor label'),walls};
    });
    unique(floors.map(f=>f.id),'floor');

  if(target) moveChest(id,target.dataset.slot || null);
});
document.addEventListener('dragend',()=>{ignoreClickUntil=Date.now()+180;clearDrag();});

document.addEventListener('click',event=>{
  if(Date.now()<ignoreClickUntil) return;
  const button=event.target.closest('button');
  if(button?.dataset.floor!==undefined) {setFloor(Number(button.dataset.floor));return;}
  if(button?.dataset.find) {closeSearch(true);selectChest(button.dataset.find,true);return;}
  if(picked && event.target.closest('#stagingDrop')) {moveChest(picked,null);return;}
  if(button?.dataset.slot && picked) {moveChest(picked,button.dataset.slot);return;}
  if(button?.dataset.chest) {selectChest(button.dataset.chest);return;}
  if(button?.dataset.slot) {openChestEditor(null,button.dataset.slot);return;}
  if(button?.dataset.action==='edit') {openChestEditor(selected);return;}
  if(button?.dataset.action==='delete') {commit(Layout.deleteChest(layout,selected),'Chest deleted · Undo to restore');return;}
  if(button?.dataset.action==='pick') {picked=picked?null:selected;renderInspector();markSelection();return;}
  if(button?.dataset.action==='stage') {moveChest(selected,null);return;}
  if(!event.target.closest('.search-wrap')) closeSearch();
});
$('undo').addEventListener('click',undo);
$('redo').addEventListener('click',redo);
$('export').addEventListener('click',exportLayout);
$('import').addEventListener('click',()=>$('importFile').click());
$('importFile').addEventListener('change',event=>{const file=event.target.files[0];event.target.value='';importLayout(file);});
$('search').addEventListener('input',renderSearch);
$('search').addEventListener('focus',()=>{if($('search').value.trim())renderSearch();});
$('search').addEventListener('keydown',event=>{
  if(event.key==='ArrowDown') {event.preventDefault();$('results').querySelector('button')?.focus();}
  if(event.key==='Enter') {
    const result=matchingChests($('search').value)[0];
    if(result) {event.preventDefault();closeSearch(true);selectChest(result.id,true);}
  }
});
document.addEventListener('keydown',event=>{
  if(document.querySelector('dialog[open]')) return;
  if(event.key==='Escape') {picked=null;clearDrag();closeSearch(true);renderInspector();markSelection();return;}
  if(event.target.matches('input,textarea,[contenteditable]')) return;
  if((event.ctrlKey||event.metaKey) && event.key.toLowerCase()==='z') {event.preventDefault();event.shiftKey?redo():undo();}
  if((event.ctrlKey||event.metaKey) && event.key.toLowerCase()==='y') {event.preventDefault();redo();}
  if((event.key==='Enter'||event.key===' ') && event.target.id==='stagingDrop' && picked) {event.preventDefault();moveChest(picked,null);}
});
render();
if(startupError) showError(startupError);
else if(migratedCache) save();

// Dialog drafts are committed together, so Cancel never changes the layout.
let chestDraft=null, chestTarget=null, chestIsNew=false, floorDraft=null, floorIsNew=false;
const catalogEntries=ITEM_CATALOG.map(item=>({name:item.displayName,itemId:'minecraft:'+item.name,
  search:normalize(item.displayName+' '+item.name+' minecraft:'+item.name).replace(/_/g,' ')}));

function openChestEditor(id=null,target=null) {
  const c=id?indexes.chests.get(id):null;
  if(id&&!c) return;
  picked=null;markSelection();renderInspector();
  chestDraft=c?structuredClone(c):{id:'chest-'+crypto.randomUUID(),label:'New chest',family:'',role:'',items:[],sourceSlot:'',sourceGroup:''};
  chestTarget=target;chestIsNew=!c;
  $('chestEditorHeading').textContent=c?'Edit chest':'Create chest';
  $('chestName').value=chestDraft.label;
  $('saveChest').textContent=c?'Save chest':'Create chest';
  $('catalogSearch').value='';
  $('chestEditError').hidden=true;
  renderDraftItems();renderCatalog();
  $('chestEditor').showModal();
  $('chestName').focus();
  if(!c) $('chestName').select();
}

function renderDraftItems() {
  $('draftItemCount').textContent=chestDraft.items.length;
  $('draftItems').innerHTML=chestDraft.items.length?chestDraft.items.map((item,i)=>`<div class="draft-item"><input data-item-name="${i}" aria-label="Item name ${i+1}" value="${escapeHTML(item.name)}" required maxlength="500" autocomplete="off"><button type="button" class="quiet remove-item" data-remove-item="${i}" aria-label="Remove ${escapeHTML(item.name)}">✕</button></div>`).join(''):'<p class="empty-detail">No items yet.</p>';
}

function catalogMatches(query) {
  const normalized=normalize(query).replace(/_/g,' ').trim();
  if(!normalized) return [];
  const words=normalized.split(/\s+/);
  return catalogEntries.filter(item=>words.every(w=>item.search.includes(w))).sort((a,b)=>{
    const rank=item=>normalize(item.name)===normalized?0:normalize(item.name).startsWith(normalized)?1:2;
    return rank(a)-rank(b)||a.name.localeCompare(b.name);
  });
}

function renderCatalog() {
  const query=$('catalogSearch').value.trim(),results=$('catalogResults');
  const matches=catalogMatches(query);
  results.hidden=!query;
  results.innerHTML=query?matches.slice(0,20).map(item=>`<button type="button" data-add-item="${escapeHTML(item.itemId)}"><span>${escapeHTML(item.name)}</span><small>${escapeHTML(item.itemId)}</small><span aria-hidden="true">＋</span></button>`).join('')+`<button type="button" class="custom-item" data-custom-item="true"><span>Add custom: ${escapeHTML(query)}</span><span aria-hidden="true">＋</span></button>`:'';
}

function addDraftItem(item) {
  chestDraft.items.push({name:item.name,itemId:item.itemId||''});
  renderDraftItems();
  $('draftItems').lastElementChild?.scrollIntoView({block:'nearest'});
  $('catalogSearch').focus({preventScroll:true});
}

function openFloorEditor(id=null) {
  const f=id===null?null:indexes.floors.get(id);
  if(id!==null&&!f) return;
  floorIsNew=!f;
  floorDraft=f?structuredClone(f):{id:Math.max(-1,...layout.floors.map(f=>f.id))+1,name:'New floor',shortName:'New floor',walls:['T','R','B','L']};
  $('floorEditorHeading').textContent=f?'Edit floor':'Create floor';
  $('floorTitle').value=floorDraft.name;
  for(const input of $('floorForm').querySelectorAll('input[name=wall]')) input.checked=floorDraft.walls.includes(input.value);
  $('deleteFloor').hidden=!f;
  $('floorEditError').hidden=true;
  $('floorEditor').showModal();$('floorTitle').focus();
  if(!f) $('floorTitle').select();
}

$('newChest').addEventListener('click',()=>openChestEditor());
$('newFloor').addEventListener('click',()=>openFloorEditor());
$('editFloor').addEventListener('click',()=>openFloorEditor(floor));
$('catalogSearch').addEventListener('input',renderCatalog);
$('catalogSearch').addEventListener('keydown',event=>{
  if(event.key==='Enter'&&$('catalogSearch').value.trim()) {
    event.preventDefault();
    const first=catalogMatches($('catalogSearch').value)[0];
    addDraftItem(first||{name:$('catalogSearch').value.trim(),itemId:''});
  }
});
$('draftItems').addEventListener('input',event=>{
  if(event.target.dataset.itemName!==undefined) chestDraft.items[Number(event.target.dataset.itemName)].name=event.target.value;
});
document.addEventListener('click',event=>{
  const button=event.target.closest('button');
  if(!button) return;
  if(button.dataset.close) {$(button.dataset.close).close();return;}
  if(button.dataset.removeItem!==undefined) {chestDraft.items.splice(Number(button.dataset.removeItem),1);renderDraftItems();return;}
  if(button.dataset.addItem) {const item=catalogEntries.find(i=>i.itemId===button.dataset.addItem);if(item)addDraftItem(item);return;}
  if(button.dataset.customItem) addDraftItem({name:$('catalogSearch').value.trim(),itemId:''});
});
$('chestForm').addEventListener('submit',event=>{
  event.preventDefault();
  try {
    const old=indexes.chests.get(chestDraft.id);
    const changed=old&&JSON.stringify(old.items)!==JSON.stringify(chestDraft.items);
    const nextChest={...chestDraft,label:$('chestName').value.trim(),items:chestDraft.items.map(i=>({...i,name:i.name.trim()})),
      family:changed?'':chestDraft.family,role:changed?'':chestDraft.role};
    const next=Layout.saveChest(layout,nextChest,chestIsNew?chestTarget:null);
    selected=nextChest.id;
    $('chestEditor').close();
    commit(next,chestIsNew?'Chest created':'Chest updated');
  } catch(error) {$('chestEditError').textContent=error.message;$('chestEditError').hidden=false;}
});
$('floorForm').addEventListener('submit',event=>{
  event.preventDefault();
  try {
    const name=$('floorTitle').value.trim();
    const walls=[...$('floorForm').querySelectorAll('input[name=wall]:checked')].map(i=>i.value);
    const next=Layout.saveFloor(layout,{...floorDraft,name,shortName:name,walls});
    const staged=next.staging.length-layout.staging.length;
    floor=floorDraft.id;
    $('floorEditor').close();
    commit(next,staged?`${staged} chests moved to staging`:floorIsNew?'Floor created':'Floor updated');
  } catch(error) {$('floorEditError').textContent=error.message;$('floorEditError').hidden=false;}
});
$('deleteFloor').addEventListener('click',()=>{
  const next=Layout.deleteFloor(layout,floorDraft.id);
  $('floorEditor').close();
  commit(next,'Floor removed · its chests are in staging');
});

</script>
</body>
</html>
