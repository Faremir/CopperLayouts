<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>CopperLayouts · Minecraft storage</title>
<style>:root{color-scheme:dark;--bg:#101719;--panel:#172124;--raised:#1e2c2d;--line:#344548;--text:#e6eeeb;--muted:#92a8a6;--accent:#cee3a9;--gold:#e7c58b;--tile-height:57px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.4 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}button{cursor:pointer}button:disabled{opacity:.35;cursor:default}button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:3px}button{color:var(--text);background:var(--raised);border:1px solid var(--line);border-radius:7px;padding:8px 12px}button:hover:not(:disabled){border-color:#79938b;background:#263837}button.primary{background:var(--accent);border-color:var(--accent);color:#1b2b20;font-weight:650}button.primary:hover{background:#e1efc9;color:#1b2b20}button.quiet{background:transparent;border-color:transparent;padding-inline:9px}[hidden]{display:none!important}.app{max-width:1880px;margin:auto;padding:0 22px 24px}.toolbar{display:flex;align-items:center;gap:22px;min-height:72px;position:sticky;top:0;z-index:20;background:#101719f5;backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:10px;letter-spacing:.02em;font-size:17px}.chest-mark{display:inline-block;width:24px;height:19px;border:2px solid #c6aa75;border-radius:3px;background:linear-gradient(transparent 39%,#c6aa75 40%,#c6aa75 48%,transparent 49%);position:relative}.chest-mark:after{content:"";position:absolute;left:8px;top:6px;width:4px;height:6px;background:#e5d1a1;border-radius:1px}.search-wrap{position:relative;flex:1;max-width:560px;min-width:160px}input[type=search]{width:100%;height:38px;border:1px solid var(--line);border-radius:8px;background:#182325;color:var(--text);padding:8px 12px}input::placeholder{color:#8a9e9c}.actions{display:flex;align-items:center;gap:6px;margin-left:auto;white-space:nowrap}.divider{height:23px;width:1px;background:var(--line);margin:0 6px}.floors{display:flex;gap:5px;overflow-x:auto;padding:16px 0 10px;scrollbar-width:thin}.floors button{white-space:nowrap;background:transparent;border-color:transparent;font-size:12px;padding:8px 12px;color:var(--muted)}.floors button.active{background:#2e4035;color:#d7ebbc;border-color:#506b48}.floors .level{font-variant-numeric:tabular-nums;margin-right:6px;font-weight:750}.floor-heading{display:flex;align-items:center;gap:14px;justify-content:space-between;margin:5px 0 16px}h1{font-size:18px;font-weight:600;margin:0}.save-status{font-size:11px;color:var(--muted);white-space:nowrap}.save-status:before{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;background:#a3c28a;margin-right:6px}.save-status.unsaved:before{background:#d8a674}.map-scroll{overflow-x:auto;padding:3px 3px 10px;margin:0 -3px;scrollbar-width:thin}.map{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));grid-template-rows:repeat(5,auto);gap:12px;min-width:1250px;align-items:stretch}.square{min-width:0;align-self:start}.square-heading{height:27px;display:flex;gap:8px;align-items:center;padding:0 3px 5px;color:#9aadaa;font-size:11px;letter-spacing:.03em}.square-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;padding:4px;border:1px solid #34484a;border-radius:8px;background:#141e20}.chest{position:relative;display:flex;flex-direction:column;gap:3px;justify-content:flex-start;min-width:0;width:100%;height:var(--tile-height);padding:5px 6px 6px;text-align:left;background:linear-gradient(155deg,#253331,#1d292b);border:1px solid #405351;border-top:2px solid var(--chest-color,#8c9d80);border-radius:4px;user-select:none;transition:background .12s,border-color .12s,opacity .12s}.chest[draggable=true]{cursor:grab}.chest:hover:not(:disabled){background:#2c3d37;border-color:#79988b}.chest:active{cursor:grabbing}.tile-meta{display:flex;align-items:center;justify-content:space-between;gap:3px;font-size:9px;line-height:1;color:#98afa5;font-variant-numeric:tabular-nums}.tile-count{font-size:9px;color:#91a79b}.tile-label{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:11px;font-weight:550; ansition:opacity .15s}.notice.visible{opacity:1}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}body.moving .chest[data-slot]{cursor:crosshair}body.is-dragging .chest{transition:none}

.floor-navigation{display:flex;align-items:center;gap:8px}.floor-navigation .floors{flex:1;min-width:0}.floor-navigation>button{white-space:nowrap;font-size:12px}.floor-heading{justify-content:flex-start}.floor-heading>button{font-size:11px;padding:5px 9px}.save-status{margin-left:auto}.wall-opening{display:flex;align-items:center;justify-content:center;min-height:34px;font-size:11px;letter-spacing:.08em;color:#6e8980}.wall-T{grid-column:2/5;grid-row:1}.wall-R{grid-column:5;grid-row:2/5}.wall-B{grid-column:2/5;grid-row:5}.wall-L{grid-column:1;grid-row:2/5}.map.empty-map{min-width:0;display:block}.workspace.without-floor{min-height:430px;max-width:900px;margin:auto}.inspector-head>div:first-child{min-width:0;overflow-wrap:anywhere}.inspector-actions{flex-wrap:wrap;justify-content:flex-end;max-width:260px}button.danger{color:#edb9a8}button.danger:hover:not(:disabled){border-color:#b67f6b;background:#3b2a26}.editor-dialog{width:min(650px,calc(100vw - 24px));max-height:92vh;overflow:auto;padding:24px;color:var(--text);background:var(--panel);border:1px solid #597166;border-radius:14px;box-shadow:0 24px 100px #0009;scrollbar-width:thin}.editor-dialog::backdrop{background:#071012b8;backdrop-filter:blur(3px)}.dialog-heading{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:18px}.dialog-heading h2{font-size:20px;font-weight:600;margin:0}.dialog-heading>button{font-size:16px;padding:3px 8px}.field{display:grid;gap:7px;font-size:12px;color:#bed0c6;margin-bottom:20px}.editor-dialog input:not([type=checkbox]){width:100%;min-width:0;border:1px solid var(--line);border-radius:6px;background:#111d1f;color:var(--text);padding:9px 11px;font-size:13px}.catalog-label{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px;font-size:12px;color:#bed0c6}.catalog-label small{font-size:10px;color:var(--muted)}.catalog-results{max-height:204px;overflow:auto;border:1px solid #40564e;border-radius:7px;margin-top:6px;padding:4px;background:#111d1f;scrollbar-width:thin}.catalog-results>button{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;width:100%;text-align:left;border:0;background:transparent;padding:8px 10px;font-size:12px}.catalog-results>button small{grid-column:1;font-size:10px;color:var(--muted);overflow-wrap:anywhere}.catalog-results>button>span:last-child{grid-column:2;grid-row:1/3;font-size:18px;color:var(--accent);padding-left:10px}.catalog-results>button.custom-item{color:var(--gold)}.contents-heading{display:flex;align-items:center;gap:8px;margin:20px 0 9px}.contents-heading h3{font-size:13px;font-weight:550;margin:0}.contents-heading span{font-size:11px;color:var(--muted)}.draft-items{max-height:260px;overflow:auto;scrollbar-width:thin;padding:2px 4px 4px 0;display:grid;gap:6px}.draft-item{display:flex;align-items:center;gap:6px}.draft-item input{flex:1}.draft-item .remove-item{color:#b19c8c;font-size:12px}.dialog-actions{display:flex;align-items:center;justify-content:flex-end;gap:8px;margin-top:22px;padding-top:16px;border-top:1px solid var(--line)}.dialog-actions button{font-size:12px}.action-spacer{flex:1}.form-error{font-size:12px;color:#efb99f;margin:14px 0 0}.floor-dialog{max-width:500px}.wall-options{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:0;border:0;margin:0}.wall-options legend{font-size:12px;color:#bed0c6;margin-bottom:9px}.wall-options label{display:flex;align-items:center;gap:6px;padding:10px 7px;background:#1e2c2c;border:1px solid var(--line);border-radius:6px;font-size:12px;cursor:pointer}.wall-options input{accent-color:var(--accent)}.form-hint{font-size:11px;line-height:1.5;color:var(--muted);margin:14px 0 0}@media(max-width:520px){.editor-dialog{padding:17px}.wall-options{grid-template-columns:repeat(2,1fr)}.floor-heading{gap:6px}.dialog-actions{gap:5px}.dialog-actions button{padding:7px 9px}.brand{gap:6px}.chest-mark{display:none}}
:root{--wall-gap:12px;--wall-height:calc(9 * var(--tile-height) + 135px + 2 * var(--wall-gap))}.map{grid-template-columns:minmax(220px,1fr) minmax(0,3fr) minmax(220px,1fr);grid-template-rows:auto auto auto;gap:var(--wall-gap)}.wall-T{grid-column:2;grid-row:1}.wall-R{grid-column:3;grid-row:2}.wall-B{grid-column:2;grid-row:3}.wall-L{grid-column:1;grid-row:2}.wall-panel{min-width:0;min-height:0;align-self:start}.wall-scroll{overflow:auto;scrollbar-width:thin;scrollbar-color:#536d5b #152021;overscroll-behavior:contain;padding-bottom:5px}.wall-scroll:focus-visible{outline:1px solid var(--accent);outline-offset:2px}.wall-contents{display:flex;gap:var(--wall-gap);align-items:flex-start}.wall-T .square,.wall-B .square{flex:0 0 calc((100% - 2 * var(--wall-gap))/3)}.wall-L .wall-contents,.wall-R .wall-contents{flex-direction:column}.wall-L .square,.wall-R .square{width:100%;flex-shrink:0}.wall-L .wall-scroll,.wall-R .wall-scroll{max-height:var(--wall-height);padding:0 3px 0 0}.square{content-visibility:auto;contain-intrinsic-size:auto calc(3 * var(--tile-height) + 45px)}.workspace{grid-column:2;grid-row:2;min-height:430px;max-height:var(--wall-height)}.workspace.without-floor{max-height:none}.wall-opening{align-self:stretch}.floor-dialog .wall-options label{flex-direction:column;align-items:stretch;gap:8px;padding:10px}.floor-dialog .wall-options input{padding:8px;font-size:14px}.draft-item-field{flex:1;min-width:0}.draft-item-field small{display:block;font-size:10px;color:var(--muted);padding:3px 2px;overflow-wrap:anywhere}.item-variant{display:block;font-size:10px;color:var(--muted)}#clearEditor>p{font-size:13px;color:#bed0c6}.brand{white-space:nowrap;font-size:16px}.catalog-results>button span:first-child{overflow-wrap:anywhere}@media(min-width:1650px){:root{--wall-gap:16px}}@media(max-width:1200px){:root{--wall-gap:8px}.brand{font-size:14px}}@media(max-width:760px){.toolbar .actions{flex-wrap:wrap}.brand{font-size:13px}.actions #clearLayout{padding-inline:5px}}

</head>
<body>
<div class="app">
  <header class="toolbar">
    <div class="brand"><span class="chest-mark" aria-hidden="true"></span><strong>CopperLayouts</strong></div>
    <div class="search-wrap">
      <label class="sr-only" for="search">Search items or chest positions on all floors</label>
      <input id="search" type="search" placeholder="Search items or positions…" autocomplete="off" aria-controls="results" aria-expanded="false">
      <div id="results" class="results" role="region" aria-label="Search results" hidden></div>
    </div>
    <div class="actions">
      <button id="newChest" type="button">+ Chest</button>
      <button id="undo" class="quiet" type="button" title="Undo (Ctrl/Cmd+Z)" disabled>↶ <span>Undo</span></button>
      <button id="redo" class="quiet" type="button" title="Redo (Ctrl/Cmd+Shift+Z)" disabled>↷ <span>Redo</span></button>
      <span class="divider" aria-hidden="true"></span>
      <button id="clearLayout" type="button" class="quiet" title="Start with an empty layout">Clear</button>
      <button id="import" type="button" title="Open a complete layout JSON file">Import</button>
      <button id="export" class="primary" type="button" title="Download every floor, chest and staging assignment">Export</button>
      <input id="importFile" type="file" accept=".json,application/json" hidden>
    </div>
  </header>
  <div class="floor-navigation"><nav id="floors" class="floors" aria-label="Floors"></nav><button id="newFloor" class="quiet" type="button">+ Floor</button></div>
  <div class="floor-heading"><h1 id="floorName"></h1><button id="editFloor" class="quiet" type="button">Edit floor</button><span id="saveStatus" class="save-status" title="Changes save automatically in this browser">Saved</span></div>
  <div id="error" class="error" role="alert" hidden></div>
  <main id="mapScroll" class="map-scroll"><div id="map" class="map" aria-label="Floor chest layout"></div></main>
</div>
<dialog id="chestEditor" class="editor-dialog" aria-labelledby="chestEditorHeading">
  <form id="chestForm">
    <div class="dialog-heading"><h2 id="chestEditorHeading">Edit chest</h2><button type="button" data-close="chestEditor" class="quiet" aria-label="Close chest editor">✕</button></div>
    <label class="field">Chest name<input id="chestName" required maxlength="300" autocomplete="off"></label>
    <div class="catalog-label"><label for="catalogSearch">Add items</label><small>Java 26.1</small></div>
    <input id="catalogSearch" type="search" placeholder="Search items or type a custom name…" autocomplete="off" aria-controls="catalogResults">
    <div id="catalogResults" class="catalog-results"></div>
    <div class="contents-heading"><h3>Contents</h3><span id="draftItemCount"></span></div>
    <div id="draftItems" class="draft-items"></div>
    <p id="chestEditError" class="form-error" role="alert" hidden></p>
    <div class="dialog-actions"><button type="button" data-close="chestEditor">Cancel</button><button id="saveChest" type="submit" class="primary">Save chest</button></div>
  </form>
</dialog>
<dialog id="floorEditor" class="editor-dialog floor-dialog" aria-labelledby="floorEditorHeading">
  <form id="floorForm">
    <div class="dialog-heading"><h2 id="floorEditorHeading">Edit floor</h2><button type="button" data-close="floorEditor" class="quiet" aria-label="Close floor editor">✕</button></div>
    <label class="field">Floor name<input id="floorTitle" required maxlength="300" autocomplete="off"></label>
    <fieldset class="wall-options"><legend>3×3 modules per wall</legend><label>Top<input type="number" name="wall-T" data-wall-count="T" min="0" max="1000" step="1" required></label><label>Right<input type="number" name="wall-R" data-wall-count="R" min="0" max="1000" step="1" required></label><label>Bottom<input type="number" name="wall-B" data-wall-count="B" min="0" max="1000" step="1" required></label><label>Left<input type="number" name="wall-L" data-wall-count="L" min="0" max="1000" step="1" required></label></fieldset>
    <p class="form-hint">0 leaves a wall open. Chests from removed modules move to staging.</p>
    <p id="floorEditError" class="form-error" role="alert" hidden></p>
    <div class="dialog-actions"><button id="deleteFloor" type="button" class="danger">Delete floor</button><span class="action-spacer"></span><button type="button" data-close="floorEditor">Cancel</button><button type="submit" class="primary">Save floor</button></div>
  </form>
</dialog>
<dialog id="clearEditor" class="editor-dialog floor-dialog" aria-labelledby="clearHeading">
  <div class="dialog-heading"><h2 id="clearHeading">Clear layout?</h2><button type="button" data-close="clearEditor" class="quiet" aria-label="Close clear layout">✕</button></div>
  <p>Remove every floor, chest, and staged item. You can Undo this while the page stays open.</p>
  <div class="dialog-actions"><button type="button" data-close="clearEditor">Cancel</button><button id="confirmClear" type="button" class="danger">Clear layout</button></div>
</dialog>
<div id="notice" class="notice" role="status" aria-live="polite"></div>

  dragged=node.dataset.chest;selected=dragged;picked=null;
  event.dataTransfer.effectAllowed='move';
  event.dataTransfer.setData('application/x-minecraft-storage-chest',dragged);
  event.dataTransfer.setData('text/plain',dragged);
  node.classList.add('dragging');
  document.body.classList.add('is-dragging');
  renderInspector();markSelection();
});
document.addEventListener('dragover',event=>{
  if(!dragged) return;
  const target=dropTarget(event);
  if(dropHighlight!==target) {
    dropHighlight?.classList.remove('drop-target');
    dropHighlight=target;
    target?.classList.add('drop-target');
  }
  if(target) {event.preventDefault();event.dataTransfer.dropEffect='move';}
});
document.addEventListener('dragleave',event=>{
  if(!event.relatedTarget && dropHighlight) {dropHighlight.classList.remove('drop-target');dropHighlight=null;}
});
document.addEventListener('drop',event=>{
  if(!dragged) return;
  event.preventDefault();
  const target=dropTarget(event), id=dragged;
  clearDrag();
  ignoreClickUntil=Date.now()+180;
  if(target) moveChest(id,target.dataset.slot || null);
});
document.addEventListener('dragend',()=>{ignoreClickUntil=Date.now()+180;clearDrag();});

document.addEventListener('click',event=>{
  if(Date.now()<ignoreClickUntil) return;
  const button=event.target.closest('button');
  if(button?.dataset.floor!==undefined) {setFloor(Number(button.dataset.floor));return;}
  if(button?.dataset.find) {closeSearch(true);selectChest(button.dataset.find,true);return;}
  if(picked && event.target.closest('#stagingDrop')) {moveChest(picked,null);return;}
  if(button?.dataset.slot && picked) {moveChest(picked,button.dataset.slot);return;}
  if(button?.dataset.chest) {selectChest(button.dataset.chest);return;}
  if(button?.dataset.slot) {openChestEditor(null,button.dataset.slot);return;}
  if(button?.dataset.action==='edit') {openChestEditor(selected);return;}
  if(button?.dataset.action==='delete') {commit(Layout.deleteChest(layout,selected),'Chest deleted · Undo to restore');return;}
  if(button?.dataset.action==='pick') {picked=picked?null:selected;renderInspector();markSelection();return;}
  if(button?.dataset.action==='stage') {moveChest(selected,null);return;}
  if(!event.target.closest('.search-wrap')) closeSearch();
});
$('undo').addEventListener('click',undo);
$('redo').addEventListener('click',redo);
$('export').addEventListener('click',exportLayout);
$('import').addEventListener('click',()=>$('importFile').click());
$('importFile').addEventListener('change',event=>{const file=event.target.files[0];event.target.value='';importLayout(file);});
$('search').addEventListener('input',renderSearch);
$('search').addEventListener('focus',()=>{if($('search').value.trim())renderSearch();});
$('search').addEventListener('keydown',event=>{
  if(event.key==='ArrowDown') {event.preventDefault();$('results').querySelector('button')?.focus();}
  if(event.key==='Enter') {
    const result=matchingChests($('search').value)[0];
    if(result) {event.preventDefault();closeSearch(true);selectChest(result.id,true);}
  }
});
document.addEventListener('keydown',event=>{
  if(document.querySelector('dialog[open]')) return;
  if(event.key==='Escape') {picked=null;clearDrag();closeSearch(true);renderInspector();markSelection();return;}
  if(event.target.matches('input,textarea,[contenteditable]')) return;
  if((event.ctrlKey||event.metaKey) && event.key.toLowerCase()==='z') {event.preventDefault();event.shiftKey?redo():undo();}
  if((event.ctrlKey||event.metaKey) && event.key.toLowerCase()==='y') {event.preventDefault();redo();}
  if((event.key==='Enter'||event.key===' ') && event.target.id==='stagingDrop' && picked) {event.preventDefault();moveChest(picked,null);}
});
render();
if(startupError) showError(startupError);
else if(migratedCache) save();

// Dialog drafts are committed together, so Cancel never changes the layout.
let chestDraft=null, chestTarget=null, chestIsNew=false, floorDraft=null, floorIsNew=false;
const catalogEntries=ITEM_CATALOG.map(item=>({name:item.displayName,itemId:'minecraft:'+item.name,
  search:normalize(item.displayName+' '+item.name+' minecraft:'+item.name).replace(/_/g,' ')}));

function openChestEditor(id=null,target=null) {
  const c=id?indexes.chests.get(id):null;
  if(id&&!c) return;
  picked=null;markSelection();renderInspector();
  chestDraft=c?structuredClone(c):{id:'chest-'+crypto.randomUUID(),label:'New chest',family:'',role:'',items:[],sourceSlot:'',sourceGroup:''};
  chestTarget=target;chestIsNew=!c;
  $('chestEditorHeading').textContent=c?'Edit chest':'Create chest';
  $('chestName').value=chestDraft.label;
  $('saveChest').textContent=c?'Save chest':'Create chest';
  $('catalogSearch').value='';
  $('chestEditError').hidden=true;
  renderDraftItems();renderCatalog();
  $('chestEditor').showModal();
  $('chestName').focus();
  if(!c) $('chestName').select();
}

function renderDraftItems() {
  $('draftItemCount').textContent=chestDraft.items.length;
  $('draftItems').innerHTML=chestDraft.items.length?chestDraft.items.map((item,i)=>`<div class="draft-item"><div class="draft-item-field"><input data-item-name="${i}" aria-label="Item name ${i+1}" value="${escapeHTML(item.name)}" required maxlength="500" autocomplete="off"><small>${escapeHTML(item.itemId||'Custom item')}</small></div><button type="button" class="quiet remove-item" data-remove-item="${i}" aria-label="Remove ${escapeHTML(item.name)}">✕</button></div>`).join(''):'<p class="empty-detail">No items yet.</p>';
}

function catalogMatches(query) {
  const normalized=normalize(query).replace(/_/g,' ').trim();
  if(!normalized) return [];
  const words=normalized.split(/\s+/);
  return catalogEntries.filter(item=>words.every(w=>item.search.includes(w))).sort((a,b)=>{
    const rank=item=>normalize(item.name)===normalized?0:normalize(item.name).startsWith(normalized)?1:2;
    return rank(a)-rank(b)||a.name.localeCompare(b.name);
  });
}

function renderCatalog() {
  const query=$('catalogSearch').value.trim(),results=$('catalogResults');
  const matches=catalogMatches(query);
  results.hidden=!query;
  results.innerHTML=query?matches.slice(0,20).map(item=>`<button type="button" data-add-item="${escapeHTML(item.itemId)}"><span>${escapeHTML(item.name)}</span><small>${escapeHTML(item.itemId)}</small><span aria-hidden="true">＋</span></button>`).join('')+`<button type="button" class="custom-item" data-custom-item="true"><span>Add custom: ${escapeHTML(query)}</span><span aria-hidden="true">＋</span></button>`:'';
}

function addDraftItem(item) {
  chestDraft.items.push({name:item.name,itemId:item.itemId||''});
  renderDraftItems();
  $('draftItems').lastElementChild?.scrollIntoView({block:'nearest'});
  $('catalogSearch').focus({preventScroll:true});
}

function openFloorEditor(id=null) {
  const f=id===null?null:indexes.floors.get(id);
  if(id!==null&&!f) return;
  floorIsNew=!f;
  floorDraft=f?structuredClone(f):{id:Math.max(-1,...layout.floors.map(f=>f.id))+1,name:'New floor',shortName:'New floor',walls:['T','R','B','L'],moduleCounts:{T:3,R:3,B:3,L:3}};
  $('floorEditorHeading').textContent=f?'Edit floor':'Create floor';
  $('floorTitle').value=floorDraft.name;
  for(const input of $('floorForm').querySelectorAll('[data-wall-count]')) input.value=floorDraft.moduleCounts[input.dataset.wallCount];
  $('deleteFloor').hidden=!f;
  $('floorEditError').hidden=true;
  $('floorEditor').showModal();$('floorTitle').focus();
  if(!f) $('floorTitle').select();
}

$('newChest').addEventListener('click',()=>openChestEditor());
$('newFloor').addEventListener('click',()=>openFloorEditor());
$('editFloor').addEventListener('click',()=>openFloorEditor(floor));
$('clearLayout').addEventListener('click',()=>$('clearEditor').showModal());
$('confirmClear').addEventListener('click',()=>{
  $('clearEditor').close();clearDrag();closeSearch(true);
  commit(Layout.clear(layout),'Layout cleared · Undo to restore');
});
$('catalogSearch').addEventListener('input',renderCatalog);
$('catalogSearch').addEventListener('keydown',event=>{
  if(event.key==='Enter'&&$('catalogSearch').value.trim()) {
    event.preventDefault();
    const first=catalogMatches($('catalogSearch').value)[0];
    addDraftItem(first||{name:$('catalogSearch').value.trim(),itemId:''});
  }
});
$('draftItems').addEventListener('input',event=>{
  if(event.target.dataset.itemName!==undefined) chestDraft.items[Number(event.target.dataset.itemName)].name=event.target.value;
});
document.addEventListener('click',event=>{
  const button=event.target.closest('button');
  if(!button) return;
  if(button.dataset.close) {$(button.dataset.close).close();return;}
  if(button.dataset.removeItem!==undefined) {chestDraft.items.splice(Number(button.dataset.removeItem),1);renderDraftItems();return;}
  if(button.dataset.addItem) {const item=catalogEntries.find(i=>i.itemId===button.dataset.addItem);if(item)addDraftItem(item);return;}
  if(button.dataset.customItem) addDraftItem({name:$('catalogSearch').value.trim(),itemId:''});
});
$('chestForm').addEventListener('submit',event=>{
  event.preventDefault();
  try {
    const old=indexes.chests.get(chestDraft.id);
    const changed=old&&JSON.stringify(old.items)!==JSON.stringify(chestDraft.items);
    const nextChest={...chestDraft,label:$('chestName').value.trim(),items:chestDraft.items.map(i=>({...i,name:i.name.trim()})),
      family:changed?'':chestDraft.family,role:changed?'':chestDraft.role};
    const next=Layout.saveChest(layout,nextChest,chestIsNew?chestTarget:null);
    selected=nextChest.id;
    $('chestEditor').close();
    commit(next,chestIsNew?'Chest created':'Chest updated');
  } catch(error) {$('chestEditError').textContent=error.message;$('chestEditError').hidden=false;}
});
$('floorForm').addEventListener('submit',event=>{
  event.preventDefault();
  try {
    const name=$('floorTitle').value.trim();
    const moduleCounts=Object.fromEntries([...$('floorForm').querySelectorAll('[data-wall-count]')].map(i=>[i.dataset.wallCount,i.valueAsNumber]));
    if(Object.values(moduleCounts).some(n=>!Number.isSafeInteger(n)||n<0||n>Layout.MAX_MODULES_PER_WALL)) throw new Error(`Use a whole number from 0 to ${Layout.MAX_MODULES_PER_WALL.toLocaleString()} for each wall.`);
    const walls=['T','R','B','L'].filter(w=>moduleCounts[w]>0);
    const next=Layout.saveFloor(layout,{...floorDraft,name,shortName:name,walls,moduleCounts});
    const staged=next.staging.length-layout.staging.length;
    floor=floorDraft.id;
    $('floorEditor').close();
    commit(next,staged?`${staged} chests moved to staging`:floorIsNew?'Floor created':'Floor updated');
  } catch(error) {$('floorEditError').textContent=error.message;$('floorEditError').hidden=false;}
});
$('deleteFloor').addEventListener('click',()=>{
  const next=Layout.deleteFloor(layout,floorDraft.id);
  $('floorEditor').close();
  commit(next,'Floor removed · its chests are in staging');
});

</script>
</body>
